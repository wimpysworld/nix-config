# Proposed refactor of freshener.yml (move 1 of 2: deduplicate into a matrix).
#
# This preserves the current behaviour of every job while removing the
# copy-pasted checkout, Nix setup, cache, and pull request scaffolding. Each
# package now contributes one matrix entry plus a short "update" script, and
# the shared steps run once.
#
# Move 2 (a separate change) migrates the "package" entries from hand-rolled
# prefetch and sed to nix-update where the derivation shape allows it. Defold
# (artefacts re-pushed under one tag) keeps bespoke update logic until its
# derivation is reshaped.
name: Package Freshener 🍋
on:
  schedule:
    - cron: "20 4 * * 2,4"
  workflow_dispatch:

jobs:
  freshen:
    name: ${{ matrix.name }} 📦
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    strategy:
      # Keep going when one package fails so an upstream outage does not block
      # the others.
      fail-fast: false
      matrix:
        include:
          # The Waybar widget refreshes and rewrites the Claude and Codex OAuth
          # tokens, so a person reviews the upstream diff before each upgrade
          # merges.
          - id: ai-usagebar
            name: ai-usagebar
            changelog: https://github.com/akitaonrails/ai-usagebar/releases
            automerge: false
          - id: defold
            name: Defold
            changelog: https://github.com/defold/defold/releases
          - id: chainctl
            name: chainctl
            changelog: https://edu.chainguard.dev/chainguard/chainctl/
          - id: concord
            name: Concord
            changelog: https://github.com/chojs23/concord/releases
          - id: claude-themes-catppuccin
            name: Claude Themes Catppuccin
            changelog: https://github.com/matcra587/claude-themes/commits/main/plugins/catppuccin
          - id: handy
            name: Handy
            changelog: https://github.com/cjpais/Handy/releases
          - id: lan-mouse
            name: Lan Mouse
            changelog: https://github.com/feschber/lan-mouse/releases
          - id: manuscript
            name: Manuscript
            changelog: https://gitlab.com/ilshat-apps/manuscript/-/blob/main/CHANGELOG.md
          - id: hermes-agent
            name: Hermes Agent
            changelog: https://github.com/NousResearch/hermes-agent/releases
          # Context Bar reads every agent transcript and runs outside Fence, so
          # a person reviews the upstream diff before each upgrade merges.
          - id: herdr-ctx-bar
            name: Herdr Context Bar
            changelog: https://github.com/pdalinis/herdr-ctx-bar/releases
            automerge: false
          # Model Display hooks run inside every Claude Code, Codex, and Pi
          # session, so a person reviews the upstream diff before each upgrade
          # merges.
          - id: herdr-disp-model
            name: Herdr Model Display
            changelog: https://github.com/pdalinis/herdr-disp-model/commits/main
            automerge: false
          # The Telegram bot can type into every Herdr agent pane, so a person
          # reviews the upstream diff before each upgrade merges.
          - id: herdr-telegram-agents
            name: Herdr Telegram Agents
            changelog: https://github.com/permgps/herdr-telegram-agents/releases
            automerge: false
          # Roamgate can type into every Herdr pane and read any file of the
          # user, so a person reviews the upstream diff before each upgrade
          # merges.
          - id: roamgate
            name: Roamgate
            changelog: https://github.com/powerfooI/roamgate/releases
            automerge: false
          - id: slk
            name: slk
            changelog: https://github.com/gammons/slk/releases
          - id: weave
            name: Weave
            changelog: https://github.com/matze/weave/releases
          - id: wolfictl
            name: wolfictl
            changelog: https://github.com/wolfi-dev/wolfictl/releases
          - id: yam
            name: yam
            changelog: https://github.com/chainguard-dev/yam/commits/main
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            eval-cores = 0
      - uses: DeterminateSystems/flakehub-cache-action@v3
      # Each package's update logic lives in its own script under
      # .github/freshener/. The script decides whether an update is needed,
      # applies it, and prints the following to $GITHUB_OUTPUT:
      #   updated=true|false
      #   version=<version or short revision>   (only when updated=true)
      #   files=<space-separated paths to stage> (only when updated=true)
      - name: Check and update ${{ matrix.name }} 🔍
        id: update
        run: .github/freshener/${{ matrix.id }}.sh
        # The scripts read no secrets; they only fetch public release metadata.

      - name: Create pull request 🚀
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          PKG_ID: ${{ matrix.id }}
          PKG_NAME: ${{ matrix.name }}
          CHANGELOG: ${{ matrix.changelog }}
          AUTOMERGE: ${{ matrix.automerge }}
          VERSION: ${{ steps.update.outputs.version }}
          FILES: ${{ steps.update.outputs.files }}
        run: .github/freshener/open-pr.sh
