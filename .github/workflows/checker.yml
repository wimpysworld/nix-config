name: Checker ✅

on:
  schedule:
    - cron: "37 13 14 * *"
  push:
    paths:
      - "lib/**.toml"
      - "lib/**-schema.json"
  workflow_dispatch:

jobs:
  toml-lint:
    name: TOML Registry Lint
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3
      - name: Validate registry schemas
        run: |
          nix shell nixpkgs#taplo --command taplo lint \
            --schema "file://$(pwd)/lib/registry-systems-schema.json" \
            lib/registry-systems.toml
          nix shell nixpkgs#taplo --command taplo lint \
            --schema "file://$(pwd)/lib/registry-users-schema.json" \
            lib/registry-users.toml
