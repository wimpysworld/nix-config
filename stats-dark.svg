<svg xmlns="http://www.w3.org/2000/svg" width="840" height="98" viewBox="0 0 840 98" role="img" aria-label="Project statistics"><title>Project statistics</title><defs><clipPath id="stats-clip"><rect x="0.5" y="0.5" width="839" height="97" rx="12"/></clipPath></defs><style>.s-label{font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:10.5px;font-weight:600;fill:#7b8495;letter-spacing:0.08em}.s-val-sans{font-family:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-size:14px;font-weight:700;fill:#f0f1f3}.s-val-mono{font-family:'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;font-size:14px;font-weight:700;fill:#f0f1f3}@keyframes stat-pulse{0%,100%{opacity:0.45;transform:scale(0.92)}50%{opacity:1;transform:scale(1.15)}}.s-dot{transform-box:fill-box;transform-origin:center;animation:stat-pulse 3.4s ease-in-out infinite}.d0{animation-delay:0s}.d1{animation-delay:0.7s}.d2{animation-delay:1.4s}.d3{animation-delay:2.1s}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><g clip-path="url(#stats-clip)"><rect x="0" y="0" width="840" height="98" fill="#181c25"/><rect x="0" y="0" width="840" height="2.5" fill="#01aaff" opacity="0.24"/><circle class="s-dot d0" cx="78" cy="30" r="3" fill="#01aaff"/><text x="88" y="34" class="s-label">COMMITS</text><text x="105" y="67" text-anchor="middle" class="s-val-mono">6,522</text><line x1="210" y1="20" x2="210" y2="78" stroke="#202632" stroke-width="1"/><circle class="s-dot d1" cx="291" cy="30" r="3" fill="#01aaff"/><text x="301" y="34" class="s-label">ISSUES</text><text x="315" y="67" text-anchor="middle" class="s-val-sans">0 open · 9 closed</text><line x1="420" y1="20" x2="420" y2="78" stroke="#202632" stroke-width="1"/><circle class="s-dot d2" cx="477" cy="30" r="3" fill="#01aaff"/><text x="487" y="34" class="s-label">PULL REQUESTS</text><text x="525" y="67" text-anchor="middle" class="s-val-sans">1,137 merged · 0 