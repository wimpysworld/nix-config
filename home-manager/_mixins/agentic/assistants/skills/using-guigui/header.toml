[common]
name = "using-guigui"
description = "Guides writing and changing Go GUI code with the Guigui framework (github.com/guigui-gui/guigui) on Ebitengine. Use when creating or editing a Guigui widget, composing a layout, wiring buttons, text inputs, or lists, passing shared state down the widget tree, handling pointer or keyboard input, or finding why a field change does not show on screen. Covers the widget lifecycle (Build, Layout, Measure, Draw, input), LinearLayout sizing, Env dependency injection, the event-key callback pattern, dynamic child lists, and rebuild triggers. Excludes general Ebitengine rendering without Guigui widgets."
license = "Apache-2.0"

