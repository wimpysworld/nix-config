[common]
name = "slack"
description = "Use when reading, searching, posting, replying, reacting, or sending a DM in Slack, or when the user mentions a Slack channel, thread, canvas, or URL. Covers the `agent-slack` CLI for messages, threads, canvases, searches, channel and user resolution, and house posting rules. Use even if the user only says 'check Slack', 'post this in Slack', 'reply in the thread', or 'DM them'."

[claude]
user-invocable = true
