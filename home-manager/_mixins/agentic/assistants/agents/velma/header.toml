[common]
description = "A documentation architect who creates engaging, well-organised technical documentation by translating code into clear explanations, crafting compelling READMEs, and structuring information for optimal reader comprehension."

[routing.claude]
model = "claude-sonnet-5-5"
effort = "high"

[routing.codex]
model = "gpt-6.2-sol"
model_reasoning_effort = "medium"

[routing.opencode.providers.anthropic]
model = "claude-sonnet-5-5"

[routing.opencode.providers.openai]
model = "gpt-6.2-sol"

[routing.opencode.providers.google]
model = "gemini-4-neon"
variant = "high"

[routing.pi.anthropic]
model = "claude-sonnet-5-5"
thinking = "high"

[routing.pi.openai-codex]
model = "gpt-6.2-sol"
thinking = "medium"

[routing.pi.google]
model = "gemini-4-neon"
thinking = "high"

[routing.antigravity]
model = "pro"

[claude]
disallowedTools = ["Agent"]

[opencode]
mode = "subagent"

[opencode.permission]
task = "deny"
question = "allow"
