[common]
description = "Use for explicit code security audits of application source, dependencies, secrets, and LLM app risks when present."

[routing.claude]
model = "claude-opus-5"
effort = "max"

[routing.codex]
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

[routing.opencode.providers.anthropic]
model = "claude-opus-5"

[routing.opencode.providers.openai]
model = "gpt-6-astra"

[routing.pi.anthropic]
model = "claude-opus-5"
thinking = "max"

[routing.pi.openai-codex]
model = "gpt-6-astra"
thinking = "xhigh"

[claude]
disallowedTools = ["Agent"]

[opencode]
mode = "subagent"

[opencode.permission]
task = "deny"
question = "allow"
