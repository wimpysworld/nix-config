[common]
description = "A technical writer who crafts engaging Linux and open-source content in Martin Wimpress's distinctive British style, blending technical accuracy with personality and humour."

[routing.claude]
model = "claude-sonnet-5"
effort = "high"

[routing.codex]
model = "gpt-6-sol"
model_reasoning_effort = "medium"

[routing.opencode.providers.anthropic]
model = "claude-sonnet-5"

[routing.opencode.providers.openai]
model = "gpt-6-sol"

[routing.pi.anthropic]
model = "claude-sonnet-5"
thinking = "high"

[routing.pi.openai-codex]
model = "gpt-6-sol"
thinking = "medium"

[claude]
disallowedTools = ["Agent"]

[opencode]
mode = "subagent"

[opencode.permission]
task = "deny"
question = "allow"
